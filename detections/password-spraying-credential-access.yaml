id: d7e3a921-6c4d-4b8f-a1e9-8f4c27d3b5e7
name: Password Spraying / Credential Stuffing after Phishing Wave
description: |
  Detects password-spraying behavior (many accounts, few passwords, one source)
  typical of the credential-access phase that follows a successful phishing
  campaign. Uses Entra ID SigninLogs failure codes. Maps to T1110.003
  (Password Spraying) under Credential Access.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 30m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
query: |
  // Password spraying: one source IP failing auth against many distinct
  // accounts with bad-password error codes inside a short window.
  // TUNING: ACCOUNT_THRESHOLD / FAILURE_THRESHOLD per your baseline.
  // Typical enterprise baseline: < 10 failures/IP/30m is normal.
  let ACCOUNT_THRESHOLD = 10;
  let FAILURE_THRESHOLD = 20;
  let LOOKBACK = 30m;
  // Entra failure codes for bad credentials
  let badCredCodes = dynamic(["50126", "50053", "50055", "50057", "50128"]);
  let failures =
      SigninLogs
      | where TimeGenerated > ago(LOOKBACK)
      | where tostring(ResultType) in (badCredCodes)
      | where IPAddress != "" and isnotempty(UserPrincipalName)
      | project TimeGenerated, IPAddress, UserPrincipalName, AppDisplayName, Location = tostring(LocationDetails.city);
  failures
  | summarize distinctAccounts = dcount(UserPrincipalName),
              failureCount = count(),
              firstSeen = min(TimeGenerated),
              lastSeen = max(TimeGenerated),
              targetAccounts = make_set(UserPrincipalName, 50),
              apps = make_set(AppDisplayName),
              locations = make_set(Location)
              by IPAddress
  | where distinctAccounts >= ACCOUNT_THRESHOLD and failureCount >= FAILURE_THRESHOLD
  // Enrich: check whether any targeted account later had a SUCCESSFUL login
  // from the same IP (spray succeeded -> compromise)
  | join kind=leftouter (
      SigninLogs
      | where TimeGenerated > ago(LOOKBACK)
      | where ResultType == 0
      | project UserPrincipalName, IPAddress
      | distinct UserPrincipalName, IPAddress
  ) on IPAddress
  | extend spraySucceeded = isnotempty(UserPrincipalName1)
  | project IPAddress, distinctAccounts, failureCount, firstSeen, lastSeen,
            spraySucceeded, targetAccounts, apps, locations
  | extend timestamp = lastSeen, IPCustomEntity = IPAddress
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPCustomEntity
version: 1.0.0
kind: Scheduled
falsePositiveNotes: |
  - Misconfigured applications or scripts with stale credentials can spray
    failures from a single IP; verify the source IP belongs to an external
    actor before escalating.
  - NAT egress means many users share one IP; require BOTH thresholds and
    review targetAccounts for randomness (sprays hit alphabetically or
    sequentially, humans don't).
  - spraySucceeded == true is the critical pivot: treat as an active account
    compromise and start IR immediately.
customDetails:
  DistinctAccounts: distinctAccounts
  FailureCount: failureCount
  SpraySucceeded: spraySucceeded
  SampleTargetAccounts: targetAccounts
